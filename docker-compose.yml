name: g119-gausdal

services:
  db:
    image: postgres:19.0-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-g119}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-g119}
      POSTGRES_DB: ${POSTGRES_DB:-g119}
    volumes:
      # Postgres 18+ lagrer data i en versjons-spesifikk undermappe og krever
      # ett mount på /var/lib/postgresql (ikke .../data) — se
      # https://github.com/docker-library/postgres/issues/37.
      - db-data:/var/lib/postgresql
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-g119} -d ${POSTGRES_DB:-g119}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # AD-10: standardverdier for lokal utvikling når .env mangler; satt i
      # .env overstyrer.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-g119}:${POSTGRES_PASSWORD:-g119}@db:5432/${POSTGRES_DB:-g119}}
      STORAGE_DIR: ${STORAGE_DIR:-/app/storage}
      PORT: '3000'
    ports:
      - '3000:3000'
    volumes:
      - app-storage:/app/storage

volumes:
  db-data:
  app-storage:
